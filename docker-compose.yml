version: '3.8'

services:
  # --- Zookeeper ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: logsentry-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - logsentry-net

  # --- Kafka ---
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: logsentry-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - logsentry-net

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: logsentry-postgres
    environment:
      POSTGRES_DB: logsentry
      POSTGRES_USER: logsentry
      POSTGRES_PASSWORD: logsentry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - logsentry-net

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: logsentry-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - logsentry-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Grafana ---
  grafana:
    image: grafana/grafana:10.3.3
    container_name: logsentry-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - logsentry-net

volumes:
  postgres-data:
  grafana-data:

networks:
  logsentry-net:
    driver: bridge
